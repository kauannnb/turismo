# /etc/nginx/sites-available/turismo
#
# Proxy reverso: a internet bate aqui na porta 80, o nginx repassa pro Next
# (PM2, porta 3000, só no localhost).
#
# Sem domínio ainda: `server_name _;` faz este bloco atender qualquer nome,
# inclusive o IP puro da VPS.
# Com domínio: troque por `server_name seudominio.com.br www.seudominio.com.br;`
# e rode `certbot --nginx -d seudominio.com.br -d www.seudominio.com.br`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploads de fotos do admin vão passar por aqui no futuro.
    client_max_body_size 20M;

    # Compressão: HTML e JS do Next comprimem muito bem.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome nunca mudam de conteúdo: cacheia pra sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O Next em produção não usa WebSocket (aquilo é o hot reload do dev),
        # então nada de headers de Upgrade aqui — eles só atrapalhariam o
        # keepalive. Streaming de RSC funciona em HTTP/1.1 normal.
        proxy_buffering off;

        proxy_read_timeout 60s;
    }
}
