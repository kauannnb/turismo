# /etc/nginx/sites-available/turismo
# Proxy reverso na frente do Next (PM2 na porta 3000).
# Enquanto não houver domínio, `server_name _;` atende pelo IP da VPS.
# Quando o domínio existir: troque por `server_name seudominio.com.br www.seudominio.com.br;`
# e rode `certbot --nginx -d seudominio.com.br -d www.seudominio.com.br`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploads de fotos do admin vão passar por aqui no futuro.
    client_max_body_size 20M;

    # Assets com hash no nome: pode cachear pra sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário pro hot reload/streaming do Next.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
